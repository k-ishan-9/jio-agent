version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: jio_redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: jio_web_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://web:8000
      - INTERNAL_RELOAD_TOKEN=secret-reload-token-jio
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: jio_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://web:8000
      - INTERNAL_RELOAD_TOKEN=secret-reload-token-jio
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - web
    restart: always

  celery_beat:
    build: .
    container_name: jio_celery_beat
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://web:8000
      - INTERNAL_RELOAD_TOKEN=secret-reload-token-jio
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - celery_worker
    restart: always
