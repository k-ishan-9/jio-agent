; deploy/supervisord.conf — runs Redis, the Celery worker, Celery beat, and
; the FastAPI app as four processes inside one Hugging Face Spaces
; container. redis has the lowest priority number so it starts first; the
; other three sleep briefly before connecting so Redis is already accepting
; connections (Celery's own broker-connection retry covers the rest).

[supervisord]
nodaemon=true
user=root

[program:redis]
priority=1
command=redis-server --port 6379 --daemonize no
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
priority=10
directory=/app
command=sh -c "sleep 3 && uvicorn api.main:app --host 0.0.0.0 --port 7860"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery_worker]
priority=10
directory=/app
command=sh -c "sleep 3 && celery -A tasks.celery_app worker --loglevel=info --concurrency=2"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery_beat]
priority=10
directory=/app
command=sh -c "sleep 5 && celery -A tasks.celery_app beat --loglevel=info"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
